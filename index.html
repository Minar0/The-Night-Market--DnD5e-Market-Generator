<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Night Market</title>
  <link rel="icon" href="icons/favicon.png" type="image/png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="container">
    <aside id="sidebar">
      <button id="generateBtn">Generate Merchants</button>
      <button id="saveBtn" disabled>Export Inventory JSON</button>
      <button id="exportBtn" disabled>Export Player HTML</button>
      <div id="loadingSpinner" class="spinner" style="display: none;"></div>
      <h3>Merchants</h3>
      <ul id="shopList">
        <!-- The list of shopkeepers will go here, when generated by JS -->
      </ul>
    </aside>
    
    <!-- Main content -->
    <main id="mainContent">
      <h2 id="shopName">Select a Merchant</h2>
      <h3 id="shopLore"></h3>
      <div id="shopItems">
        <!-- The list of items a merchant sells will go here, when generated by JS -->
      </div>
    </main>
  </div>

  <script src="merchant_types.js"></script>
  <script src="shop_functions.js"></script>
  <script src="script.js"></script>
</body>
</html>
